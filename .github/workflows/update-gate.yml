# Re-runs the self-update scope gate on every auto-update/* pull request.
# The gate script is taken from the base commit, so editing the script in the
# pull request changes nothing. This workflow file itself runs from the pull
# request, though: a pull request that edits it can weaken the check, which is
# why the path check rejects any .github/ change and a reviewer must too.
# Required on main, but skipped (and so passing) on branches not named
# auto-update/*: a self-update under any other branch name is closed unreviewed.
# Read-only: no secrets, no write token.
name: Update gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    if: startsWith(github.head_ref, 'auto-update/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check changed paths from git objects (immune to .gitignore tricks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Compare commits directly, so ignore rules in the pull request cannot
          # hide a file from this check. Only additions and edits to the allowed
          # paths pass; any .gitignore or .gitattributes change fails.
          git diff --name-status --no-renames "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          python -I - "$RUNNER_TEMP/changed.txt" <<'PY'
          import re, sys
          ok = re.compile(r"^(checks\.toml|LESSONS\.md|CHANGELOG\.md|research/[A-Za-z0-9._-]+\.md)$")
          bad = []
          for line in open(sys.argv[1]):
              status, _, path = line.rstrip("\n").partition("\t")
              name = path.rsplit("/", 1)[-1]
              if name in (".gitignore", ".gitattributes") or status not in ("A", "M") or not ok.match(path):
                  bad.append(f"{status} {path}")
          if bad:
              print("Not allowed in an auto-update pull request:", *bad, sep="\n  ")
              sys.exit(1)
          print("Changed paths are all within the allow-list.")
          PY

      - name: Run the gate from the base commit against the pull request's changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          month="${HEAD_REF#auto-update/}"
          case "$month" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]) ;;
            *) echo "Branch must be auto-update/YYYY-MM, got $HEAD_REF"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/gate"
          git show "$BASE_SHA:.github/scripts/check_update_scope.py" > "$RUNNER_TEMP/gate/check_update_scope.py"
          # Move HEAD to the base commit and keep the pull request's files, so
          # its changes appear as uncommitted edits, which is what the gate checks.
          git reset --mixed "$BASE_SHA"
          python -I "$RUNNER_TEMP/gate/check_update_scope.py" --month "$month" --root "$GITHUB_WORKSPACE"
