# Monthly self-update: research what changed in the pfSense world and propose
# sourced edits to checks.toml, LESSONS.md, CHANGELOG.md and research/ as a
# draft pull request. Nothing is ever pushed to main.
#
# Setup (once):
#   1. Repository secret ANTHROPIC_API_KEY (Settings > Secrets and variables >
#      Actions). It is used only by the "research" job.
#   2. Settings > Actions > General > Workflow permissions: turn on
#      "Allow GitHub Actions to create and approve pull requests".
#   3. Protect main (ruleset): require a pull request, one approval and the
#      "CI" checks, block force pushes.
#
# Two jobs, so the model never shares a job with a write token:
#   research  holds the Anthropic key, gets a read-only GITHUB_TOKEN, has no
#             shell and can only edit the allowed paths. It uploads a patch.
#   propose   has no Anthropic key. It applies the patch, re-runs the scope
#             gate and the catalog checks, then opens a draft pull request.
#
# Versions pinned by commit SHA (checked with git ls-remote on 2026-11-05):
#   actions/checkout v7.0.1, actions/setup-python v7.1.0,
#   anthropics/claude-code-action v1.0.268, actions/upload-artifact v7.0.2,
#   actions/download-artifact v8.0.2, peter-evans/create-pull-request v8.1.1.

name: Monthly self-update

on:
  schedule:
    # 06:17 UTC on the 1st of each month (an off-hour minute avoids the
    # top-of-hour scheduling backlog).
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: monthly-self-update
  cancel-in-progress: false

jobs:
  research:
    name: Research (read-only)
    # Only from main, so the patch applies to the pull request base. (Schedule
    # payloads carry no repository object, so the branch is named here.)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      month: ${{ steps.date.outputs.month }}
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Date and trusted copies of the gate scripts
        id: date
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          cp -R .github/scripts "$RUNNER_TEMP/gate"

      - name: Research with Claude
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read-only token (contents: read). Keeps the action off the broader
          # Claude GitHub App token; this job cannot push or open PRs.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Run the monthly research pass for ${{ steps.date.outputs.month }}. Today is ${{ steps.date.outputs.today }} (UTC).
            Follow the instructions in your system prompt exactly.
            Write the research note to research/${{ steps.date.outputs.month }}.md.
          # Defense in depth, written to the runner's user settings. The
          # claude_args below are the primary restriction.
          #
          # Reads: no Read, Glob or Grep allow rule is given. Reads inside the
          # working directory (the checkout) need no approval, and dontAsk
          # denies every read outside it. blockReadsOutsideWorkingDirectories
          # and the absolute-path deny rules below (// is the filesystem
          # root) keep the process environment, the runner temp directory and
          # the home directory out of reach even if a rule is loosened later.
          # The checkout itself lives under /home/runner/work, so neither
          # //home/** nor ~/** can be denied as a whole.
          settings: |
            {
              "permissions": {
                "defaultMode": "dontAsk",
                "blockReadsOutsideWorkingDirectories": true,
                "deny": [
                  "Bash",
                  "NotebookEdit",
                  "Read(//proc/**)",
                  "Read(//sys/**)",
                  "Read(//dev/**)",
                  "Read(//etc/**)",
                  "Read(//run/**)",
                  "Read(//tmp/**)",
                  "Read(//var/**)",
                  "Read(//home/runner/work/_temp/**)",
                  "Read(~/.claude/**)",
                  "Read(~/.config/**)",
                  "Read(~/.ssh/**)",
                  "Edit(.github/**)",
                  "Edit(pfaudit.py)",
                  "Edit(README.md)",
                  "Edit(SKILL.md)",
                  "Edit(LICENSE)",
                  "Edit(.gitignore)"
                ]
              }
            }
          # Edit(/path) in CLI flags anchors at the checkout root. Write is
          # governed by the same Edit rules. dontAsk denies anything not
          # allowed here instead of prompting. WebFetch rules match hostnames
          # only (no path prefixes), so shared hosting hosts where anyone can
          # publish (s3.amazonaws.com, cdn.jsdelivr.net) are left out; the
          # feeds hosted there are recorded as "not checked". github.com and
          # raw.githubusercontent.com remain because the lesson 11 feeds and
          # the hagezi lists live there.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --max-budget-usd 10
            --permission-mode dontAsk
            --tools "Read,Glob,Grep,Edit,Write,WebFetch,WebSearch"
            --disallowedTools "Bash" "NotebookEdit" "mcp__*"
            --allowedTools "WebSearch" "Edit(/checks.toml)" "Edit(/LESSONS.md)" "Edit(/CHANGELOG.md)" "Edit(/research/**)" "WebFetch(domain:docs.netgate.com)" "WebFetch(domain:www.netgate.com)" "WebFetch(domain:forum.netgate.com)" "WebFetch(domain:redmine.pfsense.org)" "WebFetch(domain:www.freebsd.org)" "WebFetch(domain:nvd.nist.gov)" "WebFetch(domain:www.reddit.com)" "WebFetch(domain:github.com)" "WebFetch(domain:raw.githubusercontent.com)" "WebFetch(domain:www.spamhaus.org)" "WebFetch(domain:urlhaus.abuse.ch)" "WebFetch(domain:threatfox.abuse.ch)" "WebFetch(domain:feodotracker.abuse.ch)"
            --append-system-prompt-file ${{ github.workspace }}/.github/self-update-prompt.md

      - name: Fail if anything outside the allowed paths changed
        env:
          MONTH: ${{ steps.date.outputs.month }}
        run: python -I "$RUNNER_TEMP/gate/check_update_scope.py" --month "$MONTH" --root "$GITHUB_WORKSPACE"

      - name: Collect the changes as a patch
        id: collect
        run: |
          git add --intent-to-add --all
          git diff --binary HEAD > "$RUNNER_TEMP/research.patch"
          if [ -s "$RUNNER_TEMP/research.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat HEAD
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes proposed this month."
          fi

      - name: Upload the patch
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-patch
          path: ${{ runner.temp }}/research.patch
          if-no-files-found: error
          retention-days: 14

  propose:
    name: Validate and open pull request
    needs: research
    if: needs.research.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No Anthropic secret is referenced anywhere in this job.
    permissions:
      contents: write
      pull-requests: write
    env:
      MONTH: ${{ needs.research.outputs.month }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python (oldest supported)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Trusted copies of the gate scripts (taken before the patch)
        run: cp -R .github/scripts "$RUNNER_TEMP/gate"

      - name: Download the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: research-patch
          path: ${{ runner.temp }}/patch

      - name: Apply the patch
        run: |
          git apply --check "$RUNNER_TEMP/patch/research.patch"
          git apply "$RUNNER_TEMP/patch/research.patch"
          git status --short

      - name: Fail if anything outside the allowed paths changed
        run: python -I "$RUNNER_TEMP/gate/check_update_scope.py" --month "$MONTH" --root "$GITHUB_WORKSPACE"

      - name: Validate checks.toml
        run: python -I "$RUNNER_TEMP/gate/validate_catalog.py" --root "$GITHUB_WORKSPACE"

      - name: Unit tests
        run: |
          if ls tests/test*.py >/dev/null 2>&1; then
            python -m unittest discover -s tests -v
          else
            echo "No tests/test*.py yet, skipping."
          fi

      - name: Build the pull request body
        run: |
          note="research/${MONTH}.md"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "Automated monthly research pass for ${MONTH}. Workflow run: ${run_url}"
            echo
            echo "**Review checklist**"
            echo
            echo "- [ ] Every change cites a source below, and the source says what the note claims"
            echo "- [ ] New checks are \`verified_on = [\"unverified\"]\` and \`planned = true\`"
            echo "- [ ] Nothing in the diff reads like an instruction copied from a web page"
            echo "- [ ] Links point where their text says (hover before clicking)"
            echo
            echo "The research note \`${note}\` follows as plain text. It was written by a model from untrusted web content."
            echo
            # Wrap the note in a code fence longer than any backtick run inside
            # it, so no @mention, HTML entity or link in the note can render or
            # notify anyone. The scope gate also rejects mentions; this is the
            # guarantee that does not depend on detection.
            python3 -I -c 'import re,sys; t=sys.stdin.read(55000); f="`"*max(4,1+max((len(m) for m in re.findall(r"`+",t)),default=0)); print(f+"text"); print(t); print(f)' < "$note"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open a draft pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: auto-update/${{ env.MONTH }}
          base: main
          add-paths: |
            checks.toml
            LESSONS.md
            CHANGELOG.md
            research/*.md
          commit-message: "Monthly self-update ${{ env.MONTH }}"
          title: "Monthly self-update ${{ env.MONTH }}"
          body-path: ${{ runner.temp }}/pr-body.md
          draft: true
          delete-branch: true

      - name: Summary
        if: steps.cpr.outputs.pull-request-url != ''
        env:
          PR_OP: ${{ steps.cpr.outputs.pull-request-operation }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          echo "Pull request ($PR_OP): $PR_URL" >> "$GITHUB_STEP_SUMMARY"
