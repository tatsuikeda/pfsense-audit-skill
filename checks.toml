# pfsense-audit-skill check catalog
#
# Every check is read-only. "verify" describes how the audit reads state:
#   config:  a config_get_path() key, with the expected value or condition
#   command: a shell command run on the firewall, with what to look for
#   external: a test run from outside the firewall
# "verified_on" lists versions where the path or command was confirmed on a
# live system. "unverified" means it came from research and still needs
# confirmation before it can fail an audit (it reports as informational).
#
# risk: high | medium | low | info
# impact: what the fix restarts or interrupts

schema = 1

[[checks]]
id = "ACCESS-001"
category = "access"
title = "WebGUI uses HTTPS"
risk = "high"
verify = { config = "system/webgui/protocol == https" }
fix = "System > Advanced > Admin Access > Protocol HTTPS"
impact = "restarts the web GUI; no traffic interruption"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "ACCESS-002"
category = "access"
title = "WebGUI session timeout is short"
why = "Unattended admin sessions in shared offices stay open for hours by default."
risk = "medium"
verify = { config = "system/webgui/session_timeout <= 30 (default 240 when unset)" }
fix = "System > Advanced > Admin Access > Session Timeout"
impact = "none"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "ACCESS-003"
category = "access"
title = "SSH is disabled, or key-only"
risk = "high"
verify = { config = "system/ssh/enable absent, or system/ssh/sshdkeyonly == enabled", command = "sockstat -4l | grep ':22 '" }
fix = "System > Advanced > Admin Access > SSH, Authentication Method Public Key Only"
impact = "reloads sshd; active sessions stay up"
verified_on = ["ce-2.9.0"]
notes = "Reads /etc/ssh/sshd_config on the firewall, the ground truth for password authentication."

[[checks]]
id = "ACCESS-004"
category = "access"
title = "Login protection threshold is tight"
risk = "medium"
verify = { config = "system/sshguard_threshold set (empty means sshguard's own default)" }
fix = "System > Advanced > Admin Access > Login Protection"
impact = "restarts sshguard"
verified_on = ["ce-2.9.0"]
notes = "Key confirmed in syslog.inc. The built-in default value is unverified."

[[checks]]
id = "ACCESS-005"
category = "access"
title = "Admin accounts are individual, not a shared default"
risk = "high"
verify = { config = "system/user: 'admin' enabled and used by several people" }
fix = "Create named admin users; disable or strongly protect 'admin'"
impact = "none"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "ACCESS-006"
category = "access"
title = "No management ports reachable from the internet"
risk = "high"
verify = { external = "TCP 22, 80, 443 and other GUI ports to the WAN address from outside time out" }
fix = "Remove WAN pass rules and port forwards to the firewall itself"
impact = "filter reload"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "ACCESS-007"
category = "access"
title = "VPN and guest users cannot reach the firewall GUI or SSH"
why = "Any device that reaches the login page can brute force it."
risk = "high"
verify = { config = "filter/rule on openvpn and guest interfaces: no pass any to any" }
fix = "Allow only needed destinations; block This Firewall on 22, 80, 443 for non-admin networks"
impact = "filter reload"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "ACCESS-008"
category = "access"
title = "Local users have modern password hashes"
risk = "medium"
verify = { config = "system/user without md5-hash or password (legacy crypt); bcrypt-hash or sha512-hash expected" }
fix = "System > User Manager: set a new password for each listed user (stored as bcrypt), then hand out the new VPN password"
impact = "the user must log in with the new password; VPN profiles are unchanged"
verified_on = ["ce-2.9.0"]
notes = "auth.inc on 2.9.0 still accepts md5-hash (unsalted md5) at login. Seen on a predecessor box whose VPN users carried md5-hash."

[[checks]]
id = "PERIM-001"
category = "perimeter"
title = "WAN blocks private and bogon networks"
risk = "high"
verify = { config = "interfaces/wan/blockpriv and interfaces/wan/blockbogons present" }
fix = "Interfaces > WAN > Block private networks, Block bogon networks"
impact = "none"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "PERIM-002"
category = "perimeter"
title = "WAN pass rules are deliberate"
risk = "high"
verify = { config = "filter/rule interface=wan type=pass: list each with source and destination" }
fix = "Remove unused rules; restrict sources where possible"
impact = "filter reload"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "PERIM-003"
category = "perimeter"
title = "State policy is understood"
risk = "info"
verify = { config = "system/statepolicy (default if-bound since 2.8)" }
verified_on = ["ce-2.9.0"]
notes = "Floating is only needed for some multi-WAN and VTI designs."

[[checks]]
id = "PERIM-004"
category = "perimeter"
title = "IPv6 matches intent"
why = "Fresh installs can enable DHCPv6 on WAN and an IPv6 allow rule even when the site never used IPv6."
risk = "medium"
verify = { config = "interfaces/wan/ipaddrv6 and system/ipv6allow vs what the site uses" }
fix = "Disable IPv6 on WAN and remove the LAN IPv6 rule if unused"
impact = "interface reconfigure"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "PERIM-005"
category = "perimeter"
title = "No UDP services answer from the internet except intended ones"
risk = "medium"
verify = { external = "probe UDP 53, 123, 161, 500, 1900, 5353 to WAN; expect no replies" }
verified_on = ["ce-2.9.0"]

[[checks]]
id = "VPN-001"
category = "vpn"
title = "OpenVPN uses TLS-crypt and modern ciphers"
risk = "high"
verify = { config = "openvpn/openvpn-server/*/tls_type == crypt; data_ciphers GCM or CHACHA20; digest not SHA1; dh_length >= 2048 or ECDH" }
fix = "Edit the server; re-export client profiles"
impact = "restarts OpenVPN, drops tunnels; clients need new profiles if tls_type changes"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "VPN-002"
category = "vpn"
title = "A CRL is attached to the OpenVPN server"
why = "Without a CRL a lost laptop's profile cannot be revoked."
risk = "high"
verify = { config = "openvpn/openvpn-server/*/crlref set and crl/ has an entry for the server CA" }
fix = "System > Certificates > Revocation, then select it on the server"
impact = "OpenVPN reload; valid tunnels stay up"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "VPN-003"
category = "vpn"
title = "Strict user/CN matching on"
risk = "medium"
verify = { config = "openvpn/openvpn-server/*/strictusercn == yes" }
impact = "OpenVPN restart"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "VPN-004"
category = "vpn"
title = "VPN users reach only what they need"
risk = "high"
verify = { config = "filter/rule interface=openvpn: flag source any destination any" }
fix = "Replace the OpenVPN pass to any rule with rules for only the hosts and ports VPN users need"
impact = "filter reload"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "VPN-005"
category = "vpn"
title = "MFA for VPN logins"
risk = "medium"
verify = { config = "openvpn/openvpn-server/*/authmode uses RADIUS or another server with TOTP" }
verified_on = ["unverified"]

[[checks]]
id = "VPN-006"
category = "vpn"
title = "OpenVPN DCO enabled where available"
risk = "info"
verify = { command = "kldstat | grep if_ovpn" }
verified_on = ["ce-2.9.0"]
notes = "Not available on CE 2.9.0 (verified). Expected in 26.10."

[[checks]]
id = "VPN-007"
category = "vpn"
title = "Server certificate auto-renew and lifetimes"
risk = "medium"
verify = { config = "cert/* used by OpenVPN and the GUI have autorenew == enabled; report CA expiry" }
verified_on = ["ce-2.9.0"]
notes = "Auto-renew runs daily, renews at one third of lifetime, keeps the key, caps to 398 days, restarts the service."

[[checks]]
id = "VPN-008"
category = "vpn"
title = "VPN clients use the firewall for DNS"
risk = "medium"
verify = { command = "dhcp-option DNS lines in /var/etc/openvpn/server*/config.ovpn; config dns_server1-4 as fallback; must be a firewall interface address or the tunnel gateway" }
fix = "VPN > OpenVPN > Servers > DNS Server 1: the firewall's LAN address, so DNSBL and filtered forwarding apply over the tunnel"
impact = "restarts OpenVPN, drops tunnels; clients pick it up on reconnect"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "VPN-009"
category = "vpn"
title = "No legacy OpenVPN options"
risk = "medium"
verify = { config = "openvpn/openvpn-server/*/allow_compression is no (asym is INFO, yes is WARN); topology not net30" }
fix = "Allow Compression: Refuse any non-stub compression; Topology: Subnet. Re-export client profiles"
impact = "restarts OpenVPN, drops tunnels; changing topology needs new client profiles"
verified_on = ["ce-2.9.0"]
notes = "Values from openvpn.inc on 2.9.0: no, asym, yes."

[[checks]]
id = "DNS-001"
category = "dns"
title = "Plain DNS is not intercepted upstream"
risk = "high"
verify = { command = "drill example.com @192.0.2.1 returns no answer" }
fix = "If it answers, forward over DNS over TLS"
lesson = 5
verified_on = ["ce-2.9.0"]

[[checks]]
id = "DNS-002"
category = "dns"
title = "Forwarding uses TLS with hostnames"
risk = "medium"
verify = { config = "unbound/forwarding and unbound/forward_tls_upstream set; system/dns1host present" }
impact = "Unbound restart, a few seconds of DNS loss"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "DNS-003"
category = "dns"
title = "DNS servers from DHCP do not leak into forwarders"
risk = "medium"
verify = { config = "system/dnsallowoverride absent when forwarding" }
verified_on = ["ce-2.9.0"]

[[checks]]
id = "DNS-004"
category = "dns"
title = "DNSSEC setting fits the upstream"
risk = "low"
verify = { config = "unbound/dnssec with forwarding to a filtering resolver" }
lesson = 6
verified_on = ["ce-2.9.0"]

[[checks]]
id = "DNS-005"
category = "dns"
title = "Unbound custom options start with server:"
risk = "high"
verify = { config = "base64 decode unbound/custom_options; first directive line is server:" }
lesson = 7
verified_on = ["ce-2.9.0"]

[[checks]]
id = "DNS-006"
category = "dns"
title = "Clients cannot bypass the firewall's DNS"
risk = "medium"
verify = { config = "LAN rules block or redirect outbound 53 and block 853 to anything but the firewall" }
lesson = 8
fix = "Firewall > Rules > LAN: block TCP and UDP 853 to anything but the firewall, and redirect port 53 to the firewall with a NAT port forward; add a DoH server blocklist in pfBlockerNG"
impact = "filter reload"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "DNS-007"
category = "dns"
title = "Unbound is running and resolving"
risk = "high"
verify = { command = "pgrep -x unbound; drill example.com @127.0.0.1 NOERROR" }
verified_on = ["ce-2.9.0"]

[[checks]]
id = "DNS-008"
category = "dns"
title = "Resolver cache and prefetch tuned, in the GUI"
risk = "low"
verify = { command = "effective msg-cache-size and prefetch in /var/unbound/unbound.conf (last value wins); custom options checked for overrides" }
fix = "Services > DNS Resolver > Advanced Settings: Message Cache Size 50 MB or more, Prefetch Support and Prefetch DNS Key Support on; remove the same lines from custom options"
impact = "restarts Unbound (a few seconds without DNS)"
verified_on = ["ce-2.9.0"]
notes = "GUI default is 4 MB with prefetch off. The 10 MB WARN threshold is a judgement for a busy small office, not a Netgate rule."

[[checks]]
id = "PFB-001"
category = "pfblockerng"
title = "DNSBL runs in Unbound Python mode"
risk = "medium"
verify = { config = "installedpackages/pfblockerngdnsblsettings/config/0/dnsbl_mode == dnsbl_python" }
verified_on = ["ce-2.9.0"]

[[checks]]
id = "PFB-002"
category = "pfblockerng"
title = "DNSBL VIP is configured and listening"
risk = "high"
verify = { config = "pfblockerngdnsblsettings/config/0/pfb_dnsvip4 references an existing virtualip/vip", command = "sockstat -4l | grep lighttpd_pfb" }
lesson = 9
verified_on = ["ce-2.9.0"]

[[checks]]
id = "PFB-003"
category = "pfblockerng"
title = "TLD wildcard processing on for wildcard lists"
risk = "medium"
verify = { config = "pfblockerngdnsblsettings/config/0/pfb_tld == on" }
lesson = 10
verified_on = ["ce-2.9.0"]

[[checks]]
id = "PFB-004"
category = "pfblockerng"
title = "Feeds are alive and fresh"
risk = "medium"
verify = { command = "for each feed URL: HTTP 200, non-trivial size, recent Last-Modified or commit" }
lesson = 11
verified_on = ["ce-2.9.0"]

[[checks]]
id = "PFB-005"
category = "pfblockerng"
title = "Kill States on"
risk = "low"
verify = { config = "installedpackages/pfblockerngipsettings/config/0/killstates == on" }
verified_on = ["ce-2.9.0"]

[[checks]]
id = "PFB-006"
category = "pfblockerng"
title = "CNAME validation on"
risk = "low"
verify = { config = "pfblockerngdnsblsettings/config/0/pfb_cname == on" }
verified_on = ["ce-2.9.0"]

[[checks]]
id = "PFB-007"
category = "pfblockerng"
title = "Python Control on"
risk = "info"
verify = { config = "pfblockerngdnsblsettings/config/0/pfb_control == on" }
lesson = 12
verified_on = ["ce-2.9.0"]

[[checks]]
id = "PFB-008"
category = "pfblockerng"
title = "Blocking actually works"
risk = "high"
verify = { command = "a known listed domain resolves to the DNSBL VIP; a subdomain of a wildcard entry too" }
verified_on = ["ce-2.9.0"]

[[checks]]
id = "PFB-009"
category = "pfblockerng"
title = "Lists are actually refreshing"
risk = "medium"
verify = { command = "pfblockerng.php cron in /etc/crontab; list files under /var/db/pfblockerng/dnsbl and deny modified within 48 h" }
fix = "Firewall > pfBlockerNG > Update: run Force Update and read the log; if the cron line is missing, save the pfBlockerNG General page"
impact = "a forced update reloads Unbound and the firewall rules"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "REC-001"
category = "recovery"
title = "AutoConfigBackup is uploading"
risk = "high"
verify = { config = "system/acb/enable == yes", command = "grep acbupload /etc/crontab; ls /cf/conf/acb | wc -l stays near zero" }
lesson = 1
verified_on = ["ce-2.9.0"]

[[checks]]
id = "REC-002"
category = "recovery"
title = "Recommended System Patches applied"
risk = "medium"
verify = { config = "installedpackages/patches/autoapply_recommended; report recommended patches that still apply" }
verified_on = ["ce-2.9.0"]

[[checks]]
id = "REC-003"
category = "recovery"
title = "Boot environment exists before changes"
risk = "low"
verify = { command = "bectl list" }
verified_on = ["ce-2.9.0"]

[[checks]]
id = "REC-004"
category = "recovery"
title = "Firewall is up to date"
risk = "medium"
verify = { command = "pfSense-upgrade -c" }
verified_on = ["ce-2.9.0"]

[[checks]]
id = "MON-001"
category = "monitoring"
title = "Gateway monitor checks the internet, not the modem"
risk = "medium"
verify = { config = "gateways/gateway_item/*/monitor set and != gateway" }
lesson = 3
verified_on = ["ce-2.9.0"]

[[checks]]
id = "MON-002"
category = "monitoring"
title = "Email notifications configured and working"
risk = "medium"
verify = { config = "notifications/smtp/ipaddress and notifyemailaddress set", command = "last 'Could not send the message' in /var/log/system.log within 7 days is a WARN" }
fix = "System > Advanced > Notifications: fix the credentials (a revoked Gmail app password is the usual cause), then Test SMTP Settings"
impact = "none"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "MON-003"
category = "monitoring"
title = "Certificate expiry alerts on"
risk = "low"
verify = { config = "notifications/certexpire/enable == enabled" }
verified_on = ["ce-2.9.0"]

[[checks]]
id = "MON-004"
category = "monitoring"
title = "Logs leave the box"
risk = "medium"
verify = { config = "syslog/remoteserver set" }
fix = "Status > System Logs > Settings: enable Remote Logging and send to a syslog server off the box"
impact = "restarts syslogd"
verified_on = ["ce-2.9.0"]

[[checks]]
id = "HW-001"
category = "hardware"
title = "Thermal sensors loaded and temperatures sane"
risk = "medium"
verify = { config = "system/thermal_hardware set (coretemp on Intel, amdtemp on AMD)", command = "sysctl dev.cpu | grep temperature" }
lesson = 13
verified_on = ["ce-2.9.0"]

[[checks]]
id = "HW-002"
category = "hardware"
title = "Hardware crypto enabled"
risk = "low"
verify = { config = "system/crypto_hardware == aesni (or the board's QAT driver)" }
lesson = 13
verified_on = ["ce-2.9.0"]

[[checks]]
id = "HW-003"
category = "hardware"
title = "TSO and LRO off"
risk = "low"
verify = { config = "system/disablesegmentationoffloading and system/disablelargereceiveoffloading present" }
verified_on = ["ce-2.9.0"]
notes = "Reads live ifconfig options on assigned interfaces, the ground truth for TSO and LRO."

[[checks]]
id = "HW-004"
category = "hardware"
title = "Disk and pool health"
risk = "high"
verify = { command = "zpool status -x; smartctl -H on each disk" }
verified_on = ["ce-2.9.0"]

[[checks]]
id = "HW-005"
category = "hardware"
title = "CPU frequency scaling state reported"
risk = "info"
verify = { command = "sysctl dev.cpu.0.freq_levels dev.cpu.0.cx_supported; check hwpstate_intel" }
lesson = 16
verified_on = ["unverified"]

[[checks]]
id = "HW-006"
category = "hardware"
title = "Powers on after an outage"
risk = "medium"
verify = { manual = "pull AC while running; it must boot unattended" }
lesson = 15

[[checks]]
id = "UPS-001"
category = "power"
title = "UPS online and alerts on"
risk = "medium"
verify = { command = "upsc <name>@localhost ups.status == OL", config = "installedpackages/nut/config/0/email == yes" }
lesson = 4
verified_on = ["ce-2.9.0"]

[[checks]]
id = "UNIFI-001"
category = "unifi"
title = "DHCP Guarding on with the firewall as trusted server"
risk = "high"
verify = { controller = "Integration API GET /v1/sites/{siteId}/networks/{networkId}: dhcpGuarding.trustedDhcpServerIpAddresses contains the firewall address for that VLAN (interfaces/lan/ipaddr when untagged); null or absent means off. Fallback, legacy API GET rest/networkconf: dhcpguard_enabled true and dhcpd_ip_1..3 contain it" }
fix = "UniFi Network > Settings > Networks > (network) > DHCP Guarding, trusted server = the pfSense interface address"
impact = "none if the trusted address is right; a wrong one blocks all DHCP on that network"
lesson = 20
verified_on = ["unverified"]
notes = "Legacy field names confirmed in a Network 11.0.97 database. Integration API names come from Ubiquiti's 11.0.97 OpenAPI spec (developer.ui.com/network/v11.0.97/openapi.json, checked 2026-11-05) and have not been read from a live console. The list endpoint omits dhcpGuarding, so each network needs a detail call. The first published spec that has networks and dhcpGuarding is 10.0.162 (the 9.5.21 spec has neither; no earlier 10.0 spec is published, checked 2026-11-05). The collector tries them on any 10.0 or newer controller; if a networks call fails, only the networks part is dropped and the check falls back to the legacy API."

[[checks]]
id = "UNIFI-002"
category = "unifi"
title = "DHCP Snooping on"
risk = "medium"
verify = { controller = "legacy API GET /proxy/network/api/s/<site>/get/setting, section key=global_switch: dhcp_snoop true" }
fix = "UniFi Network > Settings > Networks > Global Switch Settings > DHCP Snooping"
impact = "none"
lesson = 17
verified_on = ["unifi-network-11.0.97"]
notes = "Not exposed by the Integration API (11.0.97). The field is confirmed in a Network 11.0.97 database; reading it over the legacy API with an API key is unconfirmed (see README, UniFi section)."

[[checks]]
id = "UNIFI-003"
category = "unifi"
title = "Guest SSID is marked guest and still has a password"
risk = "high"
verify = { controller = "legacy API GET rest/wlanconf: is_guest true; security != open unless listed with --unifi-open-ssid; l2_isolation on for guest SSIDs. Fallback, Integration API GET /v1/sites/{siteId}/wifi/broadcasts/{id}: hotspotConfiguration.type CAPTIVE_PORTAL counts as guest (PASSPOINT does not), securityConfiguration.type OPEN is open, clientIsolationEnabled" }
fix = "Set a password on the guest SSID (or keep the portal and add a password), mark it Guest, enable Client Device Isolation"
impact = "guest Wi-Fi clients reconnect"
lesson = 19
verified_on = ["unverified"]
notes = "Legacy names (is_guest, security, l2_isolation) confirmed in a Network 11.0.97 database. The Integration API has no guest flag, and its field names come from the 11.0.97 OpenAPI spec, not a live console. Pass --unifi-open-ssid NAME for an SSID that is open on purpose."

[[checks]]
id = "UNIFI-004"
category = "unifi"
title = "Guest restrictions do not block the firewall"
risk = "high"
verify = { controller = "legacy API GET get/setting, section key=guest_access: restricted_subnet / restricted_subnet_N contain the firewall LAN (or guest VLAN) address and allowed_subnet / allowed_subnet_N do not; WARN" }
fix = "UniFi Network > Settings > Hotspot (Guest Control) > Allowed subnets: add the firewall address"
impact = "none"
lesson = 19
verified_on = ["unifi-network-11.0.97"]
notes = "The 11.0.97 database stores numbered restricted_subnet_N; go-unifi models a single field. Both forms are parsed. Not exposed by the Integration API."

[[checks]]
id = "UNIFI-005"
category = "unifi"
title = "Devices inform to the right controller address"
risk = "medium"
verify = { controller = "legacy API GET stat/device: host of inform_url, or inform_ip, equals the --unifi host or one of its addresses for every adopted device; state 0, 9, 10 or 11 also warns. Fallback, Integration API GET /v1/sites/{siteId}/devices: reports devices whose state is not ONLINE, no inform data" }
fix = "Set the controller's Inform Host override in UniFi Network settings (menu location varies by version), or re-run set-inform on the device"
impact = "devices reconnect to the controller; no client traffic loss"
verified_on = ["unverified"]
notes = "inform_url, inform_ip and the numeric state come from aiounifi v98 and go-unifi v2.3.0, not a live console. The Integration API has no inform field."

[[checks]]
id = "UNIFI-006"
category = "unifi"
title = "No unknown DHCP servers on the LAN"
risk = "high"
verify = { command = "capture DHCP replies on LAN not from the firewall MAC for 30 to 60 seconds" }
lesson = 17
verified_on = ["ce-2.9.0"]

[[checks]]
id = "UNIFI-007"
category = "unifi"
title = "Device auto-upgrade is a deliberate choice"
risk = "info"
verify = { controller = "legacy API GET get/setting, section key=mgmt: auto_upgrade, auto_upgrade_hour; also reports x_ssh_enabled and x_ssh_auth_password_enabled (booleans only). Integration API devices: firmwareUpdatable count" }
verified_on = ["unifi-network-11.0.97"]
notes = "Auto-upgrade reboots switches and APs on their own schedule. Report it; do not demand a setting. Always INFO. Device SSH with passwords is mentioned in the detail and may become its own check."
