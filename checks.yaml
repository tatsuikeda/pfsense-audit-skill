# pfsense-audit-skill check catalog
#
# Every check is read-only. "verify" describes how the audit reads state:
#   config:  a config_get_path() key, with the expected value or condition
#   command: a shell command run on the firewall, with what to look for
#   external: a test run from outside the firewall
# "verified_on" lists versions where the path or command was confirmed on a
# live system. "unverified" means it came from research and still needs
# confirmation before it can fail an audit (it reports as informational).
#
# risk: high | medium | low | info
# impact: what the fix restarts or interrupts

schema: 1

checks:

  # ---------------------------------------------------------------- access
  - id: ACCESS-001
    category: access
    title: "WebGUI uses HTTPS"
    risk: high
    verify: { config: "system/webgui/protocol == https" }
    fix: "System > Advanced > Admin Access > Protocol HTTPS"
    impact: "restarts the web GUI; no traffic interruption"
    verified_on: [ce-2.9.0]

  - id: ACCESS-002
    category: access
    title: "WebGUI session timeout is short"
    why: "Unattended admin sessions in shared offices stay open for hours by default."
    risk: medium
    verify: { config: "system/webgui/session_timeout <= 30 (default 240 when unset)" }
    fix: "System > Advanced > Admin Access > Session Timeout"
    impact: "none"
    verified_on: [ce-2.9.0]

  - id: ACCESS-003
    category: access
    title: "SSH is disabled, or key-only"
    risk: high
    verify:
      config: "system/ssh/enable absent, or system/ssh/sshdkeyonly == enabled"
      command: "sockstat -4l | grep ':22 '"
    fix: "System > Advanced > Admin Access > SSH, Authentication Method Public Key Only"
    impact: "reloads sshd; active sessions stay up"
    verified_on: [unverified]
    notes: "Config key not yet confirmed in pfSense 2.9 source."

  - id: ACCESS-004
    category: access
    title: "Login protection threshold is tight"
    risk: medium
    verify: { config: "system/sshguard_threshold set (empty means sshguard's own default)" }
    fix: "System > Advanced > Admin Access > Login Protection"
    impact: "restarts sshguard"
    verified_on: [ce-2.9.0]
    notes: "Key confirmed in syslog.inc. The built-in default value is unverified."

  - id: ACCESS-005
    category: access
    title: "Admin accounts are individual, not a shared default"
    risk: high
    verify: { config: "system/user: 'admin' enabled and used by several people" }
    fix: "Create named admin users; disable or strongly protect 'admin'"
    impact: "none"
    verified_on: [ce-2.9.0]

  - id: ACCESS-006
    category: access
    title: "No management ports reachable from the internet"
    risk: high
    verify: { external: "TCP 22, 80, 443 and other GUI ports to the WAN address from outside time out" }
    fix: "Remove WAN pass rules and port forwards to the firewall itself"
    impact: "filter reload"
    verified_on: [ce-2.9.0]

  - id: ACCESS-007
    category: access
    title: "VPN and guest users cannot reach the firewall GUI or SSH"
    why: "Any device that reaches the login page can brute force it."
    risk: high
    verify: { config: "filter/rule on openvpn and guest interfaces: no pass any to any" }
    fix: "Allow only needed destinations; block This Firewall on 22, 80, 443 for non-admin networks"
    impact: "filter reload"
    verified_on: [ce-2.9.0]

  # ---------------------------------------------------------------- perimeter
  - id: PERIM-001
    category: perimeter
    title: "WAN blocks private and bogon networks"
    risk: high
    verify: { config: "interfaces/wan/blockpriv and interfaces/wan/blockbogons present" }
    fix: "Interfaces > WAN > Block private networks, Block bogon networks"
    impact: "none"
    verified_on: [ce-2.9.0]

  - id: PERIM-002
    category: perimeter
    title: "WAN pass rules are deliberate"
    risk: high
    verify: { config: "filter/rule interface=wan type=pass: list each with source and destination" }
    fix: "Remove unused rules; restrict sources where possible"
    impact: "filter reload"
    verified_on: [ce-2.9.0]

  - id: PERIM-003
    category: perimeter
    title: "State policy is understood"
    risk: info
    verify: { config: "system/statepolicy (default if-bound since 2.8)" }
    notes: "Floating is only needed for some multi-WAN and VTI designs."
    verified_on: [ce-2.9.0]

  - id: PERIM-004
    category: perimeter
    title: "IPv6 matches intent"
    why: "Fresh installs can enable DHCPv6 on WAN and an IPv6 allow rule even when the site never used IPv6."
    risk: medium
    verify: { config: "interfaces/wan/ipaddrv6 and system/ipv6allow vs what the site uses" }
    fix: "Disable IPv6 on WAN and remove the LAN IPv6 rule if unused"
    impact: "interface reconfigure"
    verified_on: [ce-2.9.0]

  - id: PERIM-005
    category: perimeter
    title: "No UDP services answer from the internet except intended ones"
    risk: medium
    verify: { external: "probe UDP 53, 123, 161, 500, 1900, 5353 to WAN; expect no replies" }
    verified_on: [ce-2.9.0]

  # ---------------------------------------------------------------- vpn
  - id: VPN-001
    category: vpn
    title: "OpenVPN uses TLS-crypt and modern ciphers"
    risk: high
    verify: { config: "openvpn/openvpn-server/*/tls_type == crypt; data_ciphers GCM or CHACHA20; digest not SHA1; dh_length >= 2048 or ECDH" }
    fix: "Edit the server; re-export client profiles"
    impact: "restarts OpenVPN, drops tunnels; clients need new profiles if tls_type changes"
    verified_on: [ce-2.9.0]

  - id: VPN-002
    category: vpn
    title: "A CRL is attached to the OpenVPN server"
    why: "Without a CRL a lost laptop's profile cannot be revoked."
    risk: high
    verify: { config: "openvpn/openvpn-server/*/crlref set and crl/ has an entry for the server CA" }
    fix: "System > Certificates > Revocation, then select it on the server"
    impact: "OpenVPN reload; valid tunnels stay up"
    verified_on: [ce-2.9.0]

  - id: VPN-003
    category: vpn
    title: "Strict user/CN matching on"
    risk: medium
    verify: { config: "openvpn/openvpn-server/*/strictusercn == yes" }
    impact: "OpenVPN restart"
    verified_on: [ce-2.9.0]

  - id: VPN-004
    category: vpn
    title: "VPN users reach only what they need"
    risk: high
    verify: { config: "filter/rule interface=openvpn: flag source any destination any" }
    verified_on: [ce-2.9.0]

  - id: VPN-005
    category: vpn
    title: "MFA for VPN logins"
    risk: medium
    verify: { config: "openvpn/openvpn-server/*/authmode uses RADIUS or another server with TOTP" }
    verified_on: [unverified]

  - id: VPN-006
    category: vpn
    title: "OpenVPN DCO enabled where available"
    risk: info
    verify: { command: "kldstat | grep if_ovpn" }
    notes: "Not available on CE 2.9.0 (verified). Expected in 26.10."
    verified_on: [ce-2.9.0]

  - id: VPN-007
    category: vpn
    title: "Server certificate auto-renew and lifetimes"
    risk: medium
    verify: { config: "cert/* used by OpenVPN and the GUI have autorenew == enabled; report CA expiry" }
    notes: "Auto-renew runs daily, renews at one third of lifetime, keeps the key, caps to 398 days, restarts the service."
    verified_on: [ce-2.9.0]

  # ---------------------------------------------------------------- dns
  - id: DNS-001
    category: dns
    title: "Plain DNS is not intercepted upstream"
    risk: high
    verify: { command: "drill example.com @192.0.2.1 returns no answer" }
    fix: "If it answers, forward over DNS over TLS"
    lesson: 5
    verified_on: [ce-2.9.0]

  - id: DNS-002
    category: dns
    title: "Forwarding uses TLS with hostnames"
    risk: medium
    verify: { config: "unbound/forwarding and unbound/forward_tls_upstream set; system/dns1host present" }
    impact: "Unbound restart, a few seconds of DNS loss"
    verified_on: [ce-2.9.0]

  - id: DNS-003
    category: dns
    title: "DNS servers from DHCP do not leak into forwarders"
    risk: medium
    verify: { config: "system/dnsallowoverride absent when forwarding" }
    verified_on: [ce-2.9.0]

  - id: DNS-004
    category: dns
    title: "DNSSEC setting fits the upstream"
    risk: low
    verify: { config: "unbound/dnssec with forwarding to a filtering resolver" }
    lesson: 6
    verified_on: [ce-2.9.0]

  - id: DNS-005
    category: dns
    title: "Unbound custom options start with server:"
    risk: high
    verify: { config: "base64 decode unbound/custom_options; first directive line is server:" }
    lesson: 7
    verified_on: [ce-2.9.0]

  - id: DNS-006
    category: dns
    title: "Clients cannot bypass the firewall's DNS"
    risk: medium
    verify: { config: "LAN rules block or redirect outbound 53 and block 853 to anything but the firewall" }
    lesson: 8
    verified_on: [ce-2.9.0]

  - id: DNS-007
    category: dns
    title: "Unbound is running and resolving"
    risk: high
    verify: { command: "pgrep -x unbound; drill example.com @127.0.0.1 NOERROR" }
    verified_on: [ce-2.9.0]

  # ---------------------------------------------------------------- pfblockerng
  - id: PFB-001
    category: pfblockerng
    title: "DNSBL runs in Unbound Python mode"
    risk: medium
    verify: { config: "installedpackages/pfblockerngdnsblsettings/config/0/dnsbl_mode == dnsbl_python" }
    verified_on: [ce-2.9.0]

  - id: PFB-002
    category: pfblockerng
    title: "DNSBL VIP is configured and listening"
    risk: high
    verify:
      config: "pfblockerngdnsblsettings/config/0/pfb_dnsvip4 references an existing virtualip/vip"
      command: "sockstat -4l | grep lighttpd_pfb"
    lesson: 9
    verified_on: [ce-2.9.0]

  - id: PFB-003
    category: pfblockerng
    title: "TLD wildcard processing on for wildcard lists"
    risk: medium
    verify: { config: "pfblockerngdnsblsettings/config/0/pfb_tld == on" }
    lesson: 10
    verified_on: [ce-2.9.0]

  - id: PFB-004
    category: pfblockerng
    title: "Feeds are alive and fresh"
    risk: medium
    verify: { command: "for each feed URL: HTTP 200, non-trivial size, recent Last-Modified or commit" }
    lesson: 11
    verified_on: [ce-2.9.0]

  - id: PFB-005
    category: pfblockerng
    title: "Kill States on"
    risk: low
    verify: { config: "installedpackages/pfblockerngipsettings/config/0/killstates == on" }
    verified_on: [ce-2.9.0]

  - id: PFB-006
    category: pfblockerng
    title: "CNAME validation on"
    risk: low
    verify: { config: "pfblockerngdnsblsettings/config/0/pfb_cname == on" }
    verified_on: [ce-2.9.0]

  - id: PFB-007
    category: pfblockerng
    title: "Python Control on"
    risk: info
    verify: { config: "pfblockerngdnsblsettings/config/0/pfb_control == on" }
    lesson: 12
    verified_on: [ce-2.9.0]

  - id: PFB-008
    category: pfblockerng
    title: "Blocking actually works"
    risk: high
    verify: { command: "a known listed domain resolves to the DNSBL VIP; a subdomain of a wildcard entry too" }
    verified_on: [ce-2.9.0]

  # ---------------------------------------------------------------- recovery
  - id: REC-001
    category: recovery
    title: "AutoConfigBackup is uploading"
    risk: high
    verify:
      config: "system/acb/enable == yes"
      command: "grep acbupload /etc/crontab; ls /cf/conf/acb | wc -l stays near zero"
    lesson: 1
    verified_on: [ce-2.9.0]

  - id: REC-002
    category: recovery
    title: "Recommended System Patches applied"
    risk: medium
    verify: { config: "installedpackages/patches/autoapply_recommended; report recommended patches that still apply" }
    verified_on: [ce-2.9.0]

  - id: REC-003
    category: recovery
    title: "Boot environment exists before changes"
    risk: low
    verify: { command: "bectl list" }
    verified_on: [ce-2.9.0]

  - id: REC-004
    category: recovery
    title: "Firewall is up to date"
    risk: medium
    verify: { command: "pfSense-upgrade -c" }
    verified_on: [ce-2.9.0]

  # ---------------------------------------------------------------- monitoring
  - id: MON-001
    category: monitoring
    title: "Gateway monitor checks the internet, not the modem"
    risk: medium
    verify: { config: "gateways/gateway_item/*/monitor set and != gateway" }
    lesson: 3
    verified_on: [ce-2.9.0]

  - id: MON-002
    category: monitoring
    title: "Email notifications configured and working"
    risk: medium
    verify: { config: "notifications/smtp/ipaddress and notifyemailaddress set" }
    verified_on: [ce-2.9.0]

  - id: MON-003
    category: monitoring
    title: "Certificate expiry alerts on"
    risk: low
    verify: { config: "notifications/certexpire/enable == enabled" }
    verified_on: [ce-2.9.0]

  - id: MON-004
    category: monitoring
    title: "Logs leave the box"
    risk: medium
    verify: { config: "syslog/remoteserver set" }
    verified_on: [ce-2.9.0]

  # ---------------------------------------------------------------- hardware
  - id: HW-001
    category: hardware
    title: "Thermal sensors loaded and temperatures sane"
    risk: medium
    verify:
      config: "system/thermal_hardware set (coretemp on Intel, amdtemp on AMD)"
      command: "sysctl dev.cpu | grep temperature"
    lesson: 13
    verified_on: [ce-2.9.0]

  - id: HW-002
    category: hardware
    title: "Hardware crypto enabled"
    risk: low
    verify: { config: "system/crypto_hardware == aesni (or the board's QAT driver)" }
    lesson: 13
    verified_on: [ce-2.9.0]

  - id: HW-003
    category: hardware
    title: "TSO and LRO off"
    risk: low
    verify: { config: "system/disablesegmentationoffloading and system/disablelargereceiveoffloading present" }
    verified_on: [unverified]
    notes: "Config key not yet confirmed in pfSense 2.9 source."

  - id: HW-004
    category: hardware
    title: "Disk and pool health"
    risk: high
    verify: { command: "zpool status -x; smartctl -H on each disk" }
    verified_on: [ce-2.9.0]

  - id: HW-005
    category: hardware
    title: "CPU frequency scaling state reported"
    risk: info
    verify: { command: "sysctl dev.cpu.0.freq_levels dev.cpu.0.cx_supported; check hwpstate_intel" }
    lesson: 16
    verified_on: [unverified]

  - id: HW-006
    category: hardware
    title: "Powers on after an outage"
    risk: medium
    verify: { manual: "pull AC while running; it must boot unattended" }
    lesson: 15

  # ---------------------------------------------------------------- power
  - id: UPS-001
    category: power
    title: "UPS online and alerts on"
    risk: medium
    verify:
      command: "upsc <name>@localhost ups.status == OL"
      config: "installedpackages/nut/config/0/email == yes"
    lesson: 4
    verified_on: [ce-2.9.0]

  # ---------------------------------------------------------------- unifi (read from the controller)
  - id: UNIFI-001
    category: unifi
    title: "DHCP Guarding on with the firewall as trusted server"
    risk: high
    verify: { controller: "network dhcpguard_enabled true and dhcpd_ip_1 == firewall LAN IP" }
    lesson: 20
    verified_on: [unifi-network-11.0.97]

  - id: UNIFI-002
    category: unifi
    title: "DHCP Snooping on"
    risk: medium
    verify: { controller: "global_switch setting dhcp_snoop true" }
    verified_on: [unifi-network-11.0.97]

  - id: UNIFI-003
    category: unifi
    title: "Guest SSID is marked guest and still has a password"
    risk: high
    verify: { controller: "wlan is_guest true; security != open unless intended" }
    lesson: 19
    verified_on: [unifi-network-11.0.97]

  - id: UNIFI-004
    category: unifi
    title: "Guest restrictions do not block the firewall"
    risk: high
    verify: { controller: "guest restricted subnets vs firewall LAN IP; allowed list includes it if overlapping" }
    lesson: 19
    verified_on: [unifi-network-11.0.97]

  - id: UNIFI-005
    category: unifi
    title: "Devices inform to the right controller address"
    risk: medium
    verify: { controller: "device inform_ip == controller IP for every device" }
    verified_on: [unifi-network-11.0.97]

  - id: UNIFI-006
    category: unifi
    title: "No unknown DHCP servers on the LAN"
    risk: high
    verify: { command: "capture DHCP replies on LAN not from the firewall MAC for 30 to 60 seconds" }
    lesson: 17
    verified_on: [ce-2.9.0]

  - id: UNIFI-007
    category: unifi
    title: "Device auto-upgrade is a deliberate choice"
    risk: info
    notes: "Auto-upgrade reboots switches and APs on their own schedule. Report it; do not demand a setting."
    verified_on: [unifi-network-11.0.97]
